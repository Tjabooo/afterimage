[package]
name = "afterimage"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A searchable memory of your screen: low-fps capture, local GPU OCR, full-text search and a timeline scrubber"
license = "MIT"
repository = "https://github.com/Tjabooo/afterimage"
readme = "README.md"
keywords = ["ocr", "wayland", "screen", "search", "hyprland"]

[dependencies]
base64 = "0.23"
gtk4 = { version = "0.11.5", features = ["v4_12"] }
jpeg-encoder = "0.7.1"
libc = "0.2.191"
regex = "1.13.2"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1"
ureq = { version = "3", default-features = false }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
lto = "thin"
strip = true
