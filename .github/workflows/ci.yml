name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GTK 4 and Wayland headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings
